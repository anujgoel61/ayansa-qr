<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0;url=https://ayansastudio.com/qr" />
    <meta name="theme-color" content="#fcf8f4" />
    <meta name="description" content="Explore Ayansa Studio's artwork and Instagram." />
    <title>Ayansa Studio · Explore</title>
    <link rel="canonical" href="https://ayansastudio.com/qr" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; font-family: Georgia, 'Times New Roman', serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #fcf8f4; color: #3a2926; }
      main { width: min(100% - 2rem, 430px); padding: 2rem 1.5rem 2.5rem; text-align: center; }
      .logo { display: block; width: min(230px, 70%); height: auto; margin: 0 auto .4rem; }
      h1 { font-size: clamp(1.45rem, 5vw, 1.8rem); font-weight: 400; line-height: 1.2; margin: .6rem 0 .65rem; }
      p { font-family: Arial, Helvetica, sans-serif; font-size: 1rem; line-height: 1.5; color: #66524c; margin: 0 0 1.8rem; }
      nav { display: grid; gap: .85rem; }
      a { display: block; padding: 1rem 1.2rem; border: 1px solid #604036; border-radius: .65rem; background: #604036; color: #fffaf7; text-decoration: none; font: 600 1rem/1.3 Arial, Helvetica, sans-serif; transition: background .16s, color .16s, transform .16s; }
      a:last-child { background: transparent; color: #604036; }
      a:hover { transform: translateY(-2px); background: #39251f; color: #fffaf7; }
      a:focus-visible { outline: 3px solid #bb7e65; outline-offset: 3px; }
      footer { margin-top: 2rem; font: .8rem/1.4 Arial, Helvetica, sans-serif; color: #8a746b; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="./logo.png" width="478" height="398" alt="Ayansa Studio" />
      <h1>Explore Ayansa Studio</h1>
      <p>Handcrafted art, made to be discovered.</p>
      <nav aria-label="Choose a destination">
        <a href="https://ayansastudio.com/">Visit the website</a>
        <a href="https://www.instagram.com/ayansastudio/">Follow us on Instagram</a>
      </nav>
      <footer>Thank you for being here.</footer>
    </main>
  </body>
</html>
